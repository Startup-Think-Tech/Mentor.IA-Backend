services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mentor_ia
      POSTGRES_USER: mentor_ia
      POSTGRES_PASSWORD: mentor_ia
    ports:
      - "5432:5432"
    volumes:
      - mentor_ia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentor_ia -d mentor_ia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - mentor_ia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mentor_ia_postgres_data:
  mentor_ia_redis_data:
